    .modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:grid;place-items:center;padding:14px}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:19px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.modalTitle{display:flex;justify-content:space-between;align-items:start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.modalTitle h3{margin:0}.candidate{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:11px;border-radius:12px;margin-top:8px}.notice{padding:12px;border-radius:12px;background:#fff4d6;color:#855c00;margin-bottom:12px}.empty{text-align:center;padding:35px;color:var(--muted)}

<header><div class="head"><div><div class="eyebrow">Einzeltraining</div><h1>Terminplaner</h1><div class="sub">Verfügbarkeiten, Einteilung, Warteliste und Nachrücker</div></div><div class="actions"><button class="primary" onclick="optimizeSchedule()">✨ Zeit optimal planen</button><button class="ghost" onclick="openSlotForm()">＋ Termin</button><button class="ghost" onclick="openPlayerForm()">＋ Spieler</button></div></div></header>

<script>
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const KEY='einzeltraining_planer_v1';
const seed={players:[
{id:1,name:'Luca',phone:'',active:true,frequency:'weekly',avail:[{day:'Donnerstag',from:'16:00',to:'18:30'},{day:'Freitag',from:'15:30',to:'17:00'}]},
{id:2,name:'Elias',phone:'',active:true,frequency:'weekly',avail:[{day:'Donnerstag',from:'17:00',to:'19:00'}]},
{id:3,name:'Noah',phone:'',active:true,frequency:'biweekly',weekParity:'odd',avail:[{day:'Freitag',from:'16:00',to:'19:00'}]},
{id:4,name:'Leon',phone:'',active:true,frequency:'every',avail:[{day:'Samstag',from:'10:00',to:'13:00'}]},
{id:5,name:'Emil',phone:'',active:true,frequency:'weekly',avail:[{day:'Donnerstag',from:'16:30',to:'18:00'}]}],slots:[
{id:101,date:'2026-09-24',from:'16:30',to:'17:15',max:2,note:'Technik und erster Kontakt',place:'Platz 1',players:[1],wait:[5]},
{id:102,date:'2026-09-24',from:'17:30',to:'18:15',max:2,note:'Torabschluss',place:'Platz 1',players:[2],wait:[]},
{id:103,date:'2026-09-25',from:'16:00',to:'16:45',max:2,note:'Dribbling',place:'Platz 2',players:[3],wait:[]},
{id:104,date:'2026-09-26',from:'10:30',to:'11:15',max:2,note:'Athletik und Ball',place:'Platz 1',players:[4],wait:[]}],settings:{club:'VfR Heilbronn',trainer:'',defaultMax:2,slotDuration:60,trainerBlocks:[],fixedBookings:[],cancellations:[],trainerAvail:[{id:201,type:'weekly',day:'Montag',date:'',from:'16:30',to:'19:00'},{id:202,type:'weekly',day:'Mittwoch',date:'',from:'17:00',to:'20:00'},{id:203,type:'weekly',day:'Freitag',date:'',from:'15:30',to:'18:00'},{id:204,type:'weekly',day:'Samstag',date:'',from:'10:00',to:'13:00'}]}};
let state=load();state.players.forEach(p=>{if(!p.frequency)p.frequency='weekly';if(!p.weekParity)p.weekParity='odd';if(p.price===undefined)p.price=0});if(!Array.isArray(state.settings.trainerAvail))state.settings.trainerAvail=[];state.settings.trainerAvail.forEach(a=>{if(!a.type)a.type='weekly';if(a.date===undefined)a.date=''});if(!state.settings.slotDuration)state.settings.slotDuration=60;if(!Array.isArray(state.settings.trainerBlocks))state.settings.trainerBlocks=[];state.settings.trainerBlocks.forEach(b=>{if(b.price===undefined)b.price=0});if(!Array.isArray(state.settings.fixedBookings))state.settings.fixedBookings=[];if(!Array.isArray(state.settings.cancellations))state.settings.cancellations=[];let activeTab='planung';let dayFilter='Alle';let search='';
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(seed)}catch(e){return clone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function id(){return Date.now()+Math.floor(Math.random()*999)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}function dayFromDate(d){let i=(new Date(d+'T12:00:00').getDay()+6)%7;return DAYS[i]}function fits(a,s){return a.day===dayFromDate(s.date)&&mins(a.from)<=mins(s.from)&&mins(a.to)>=mins(s.to)}
function freqLabel(f){return f==='every'?'Jeden verfügbaren Tag':f==='biweekly'?'Alle 2 Wochen':'1× wöchentlich'}function dateOnly(d){return new Date(d+'T12:00:00')}function mondayOf(d){let x=dateOnly(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x}function daysBetween(a,b){return Math.round(Math.abs(dateOnly(a)-dateOnly(b))/86400000)}function assignedSlots(pid,excludeSid=0){return state.slots.filter(x=>x.id!==excludeSid&&x.players.includes(pid))}function isoWeek(date){let d=dateOnly(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));let w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7)}function parityLabel(p){return p.weekParity==='even'?'gerade Kalenderwochen':'ungerade Kalenderwochen'}function frequencyAllows(p,s){let f=p.frequency||'weekly',assigned=assignedSlots(p.id,s.id);if(f==='every')return true;if(f==='weekly'){let m=mondayOf(s.date).getTime();return !assigned.some(x=>mondayOf(x.date).getTime()===m)}let wanted=p.weekParity==='even'?0:1;if(isoWeek(s.date)%2!==wanted)return false;return !assigned.some(x=>daysBetween(x.date,s.date)<14)}function frequencyStatus(p,s){if(frequencyAllows(p,s))return 'Trainingswunsch passt';if(p.frequency==='biweekly'){let wanted=p.weekParity==='even'?0:1;if(isoWeek(s.date)%2!==wanted)return 'Nur '+parityLabel(p);return 'In diesem 2-Wochen-Rhythmus bereits eingeplant'}return 'Diese Woche bereits eingeplant'}function priorityScore(p,s){let f=p.frequency||'weekly',dates=assignedSlots(p.id,s.id).map(x=>dateOnly(x.date).getTime()).filter(t=>t<=dateOnly(s.date).getTime());let last=dates.length?Math.max(...dates):0,age=last?(dateOnly(s.date).getTime()-last)/86400000:9999;return (f==='biweekly'?300:f==='weekly'?200:100)+age}
function trainerWindowMatchesDate(a,date){return a.type==='date'?a.date===date:a.day===dayFromDate(date)}function trainerFits(s){return state.settings.trainerAvail.some(a=>trainerWindowMatchesDate(a,s.date)&&mins(a.from)<=mins(s.from)&&mins(a.to)>=mins(s.to))}function trainerWindowsForDate(date){return state.settings.trainerAvail.filter(a=>trainerWindowMatchesDate(a,date)).sort((a,b)=>a.from.localeCompare(b.from))}function playerFitsTrainerDay(p,date){return trainerWindowsForDate(date).some(t=>p.avail.some(a=>a.day===dayFromDate(date)&&Math.max(mins(t.from),mins(a.from))<Math.min(mins(t.to),mins(a.to))))}function rangesOverlap(a1,a2,b1,b2){return Math.max(mins(a1),mins(b1))<Math.min(mins(a2),mins(b2))}function blockMatchesDate(b,date){return b.type==='date'?b.date===date:b.day===dayFromDate(date)}function blockedForSlot(s,ignoreId=0){return state.settings.trainerBlocks.some(b=>b.id!==ignoreId&&blockMatchesDate(b,s.date)&&rangesOverlap(b.from,b.to,s.from,s.to))}function nextDatesForDay(day,weeks=12){let out=[],d=new Date();d.setHours(12,0,0,0);let target=DAYS.indexOf(day);for(let i=0;i<7*weeks+7;i++){let x=new Date(d);x.setDate(d.getDate()+i);let iso=x.toISOString().slice(0,10);if(dayFromDate(iso)===day)out.push(iso);if(out.length>=weeks)break}return out}function fixedDateAllowedForPlayer(p,date){if(!p)return false;let f=p.frequency||'weekly';if(f==='biweekly'){let wanted=p.weekParity==='even'?0:1;return isoWeek(date)%2===wanted}return true}function syncFixedBookingSlots(){let validIds=new Set(state.settings.fixedBookings.map(b=>b.id));state.slots=state.slots.filter(s=>!s.fixedBookingId||validIds.has(s.fixedBookingId));for(let b of state.settings.fixedBookings){let p=player(b.playerId);let wantedDates=nextDatesForDay(b.day,12).filter(date=>fixedDateAllowedForPlayer(p,date));let wantedSet=new Set(wantedDates);state.slots=state.slots.filter(s=>s.fixedBookingId!==b.id||wantedSet.has(s.date));let existing=new Set(state.slots.filter(s=>s.fixedBookingId===b.id).map(s=>s.date));for(let date of wantedDates){if(existing.has(date))continue;let probe={date,from:b.from,to:b.to};if(blockedForSlot(probe))continue;state.slots.push({id:id(),fixedBookingId:b.id,date,from:b.from,to:b.to,max:1,note:b.note,place:b.place,players:[b.playerId],wait:[]})}}localStorage.setItem(KEY,JSON.stringify(state))}function player(pid){return state.players.find(p=>p.id===pid)}function fmtDate(d){return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hidden'),2400)}
function euro(v){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(v)||0)}function currentWeekRange(){let now=new Date(),d=new Date(now);d.setHours(12,0,0,0);let n=(d.getDay()+6)%7;let start=new Date(d);start.setDate(d.getDate()-n);let end=new Date(start);end.setDate(start.getDate()+6);return {start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10)}}function inCurrentWeek(date){let r=currentWeekRange();return date>=r.start&&date<=r.end}function childRevenueForSlot(s){return s.players.reduce((sum,pid)=>sum+(Number(player(pid)?.price)||0),0)}function teamBlockOccursThisWeek(b){let r=currentWeekRange();if(b.type==='date')return b.date>=r.start&&b.date<=r.end;return true}function currentWeekFinance(){let child=state.slots.filter(s=>inCurrentWeek(s.date)).reduce((n,s)=>n+childRevenueForSlot(s),0);let team=state.settings.trainerBlocks.filter(teamBlockOccursThisWeek).reduce((n,b)=>n+(Number(b.price)||0),0);let loss=state.settings.cancellations.filter(c=>inCurrentWeek(c.date)).reduce((n,c)=>n+(Number(c.amount)||0),0);return {child,team,income:child+team,loss}}function playerCancellationStats(pid){let list=state.settings.cancellations.filter(c=>c.playerId===pid);return {count:list.length,loss:list.reduce((n,c)=>n+(Number(c.amount)||0),0)}}function candidates(s,exclude=[]){if(!trainerFits(s)||blockedForSlot(s))return [];return state.players.filter(p=>p.active&&!s.players.includes(p.id)&&!exclude.includes(p.id)&&p.avail.some(a=>fits(a,s))&&frequencyAllows(p,s)).sort((a,b)=>{let w=(s.wait.includes(b.id)?1:0)-(s.wait.includes(a.id)?1:0);return w||priorityScore(b,s)-priorityScore(a,s)})}
function render(){renderStats();renderPlanning();renderTrainerTimes();renderFixedAppointments();renderPlayers();renderWait();renderMessages();renderStatistics();renderData()}

function renderTrainerTimes(){
  let rows=[...state.settings.trainerAvail].sort((a,b)=>((a.type==='date'?a.date:'9'+DAYS.indexOf(a.day))+(a.from||'')).localeCompare((b.type==='date'?b.date:'9'+DAYS.indexOf(b.day))+(b.from||'')));

function renderStatistics(){let f=currentWeekFinance(),rows=state.players.map(p=>({p,...playerCancellationStats(p.id)})).sort((a,b)=>b.loss-a.loss||b.count-a.count);let total=state.settings.cancellations.reduce((n,c)=>n+(Number(c.amount)||0),0);document.getElementById('statistik').innerHTML=`<div class="toolbar"><div><h2>Finanzen & Absagen</h2><div class="sub" style="color:var(--muted)">Einnahmen werden aus den aktuell belegten Terminen und Mannschaftstrainings berechnet.</div></div></div><div class="stats" style="margin-bottom:16px"><div class="stat"><div class="statIcon">💶</div><div><strong>${euro(f.income)}</strong><span>Einnahmen aktuelle Woche</span></div></div><div class="stat"><div class="statIcon">👤</div><div><strong>${euro(f.child)}</strong><span>Einzeltraining aktuell</span></div></div><div class="stat"><div class="statIcon">⚽</div><div><strong>${euro(f.team)}</strong><span>Mannschaftstraining aktuell</span></div></div><div class="stat loss"><div class="statIcon">📉</div><div><strong class="moneyLoss">${euro(f.loss)}</strong><span>Ausfall aktuelle Woche</span></div></div></div><div class="sectionBox"><div class="row"><div><h3>Absagen je Spieler</h3><p class="sub" style="color:var(--muted)">Gesamtverlust durch alle gespeicherten Absagen: <b>${euro(total)}</b></p></div></div><div class="tableWrap"><table><thead><tr><th>Spieler</th><th>Preis</th><th>Absagen</th><th>Gesamtverlust</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.p.name)}</b></td><td>${euro(x.p.price)}</td><td>${x.count}</td><td class="moneyLoss"><b>${euro(x.loss)}</b></td></tr>`).join('')}</tbody></table></div></div><div class="sectionBox" style="margin-top:14px"><h3>Absageverlauf</h3>${[...state.settings.cancellations].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="candidate"><div><b>${esc(player(c.playerId)?.name||'Gelöschter Spieler')}</b><div class="sub" style="color:var(--muted)">${fmtDate(c.date)}, ${c.from}–${c.to} Uhr</div></div><div><b class="moneyLoss">-${euro(c.amount)}</b> <button class="small" onclick="undoCancellation(${c.id})">Stornieren</button></div></div>`).join('')||'<div class="empty">Noch keine Absagen erfasst.</div>'}</div>`}function undoCancellation(cid){let c=state.settings.cancellations.find(x=>x.id===cid);if(!c)return;if(!confirm('Diese Absage aus der Statistik entfernen?'))return;state.settings.cancellations=state.settings.cancellations.filter(x=>x.id!==cid);save();toast('Absagebuchung entfernt.')}
function renderData(){document.getElementById('daten').innerHTML=`<div class="toolbar"><div><h2>Sicherung & Einstellungen</h2><div class="sub" style="color:var(--muted)">Die Daten werden automatisch nur in diesem Browser gespeichert</div></div></div><div class="grid"><div class="sectionBox"><h3>Vereinsdaten</h3><div class="formGrid"><div><label>Vereinsname</label><input id="club" value="${esc(state.settings.club||'')}"></div><div><label>Trainer</label><input id="trainer" value="${esc(state.settings.trainer||'')}"></div><div><label>Standard-Spielerzahl</label><input id="defMax" type="number" min="1" max="20" value="${state.settings.defaultMax||2}"></div><div><label>Standard-Dauer in Minuten</label><input id="slotDuration" type="number" min="15" step="5" value="${state.settings.slotDuration||60}"></div><div class="full"><button class="primary" onclick="saveSettings()">Einstellungen speichern</button></div></div></div><div class="sectionBox"><h3>Datensicherung</h3><p class="sub" style="color:var(--muted)">Export enthält Spieler, Trainingswünsche inklusive KW-Rhythmus, Trainerzeiten, Mannschaftstermine, feste Kindertermine, Preise, Einnahmen, Absagen, Verluste, Verfügbarkeiten, optimierte Termine, Belegungen, Wartelisten und Einstellungen.</p><div class="cardActions"><button class="dark" onclick="exportData()">Exportieren</button><button onclick="document.getElementById('importFile').click()">Importieren</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])"><button class="danger" onclick="resetData()">Alle Daten löschen</button></div></div></div>`}
function showModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalTitle"><h3>${title}</h3><button class="icon" onclick="closeModal()">✕</button></div>${body}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function addMinutes(t,n){let x=mins(t)+n;return String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function openSlotForm(sid,presetDate=''){let windows=trainerWindowsForDate(presetDate||new Date().toISOString().slice(0,10));let first=windows[0];let s=sid?state.slots.find(x=>x.id===sid):{date:presetDate||new Date().toISOString().slice(0,10),from:first?.from||'16:00',to:first?addMinutes(first.from,state.settings.slotDuration||60):'16:45',max:state.settings.defaultMax||2,note:'',place:'Platz 1',players:[],wait:[]};showModal(sid?'Termin bearbeiten':'Neuen Termin anlegen',`<div class="formGrid"><div><label>Datum</label><input id="sDate" type="date" value="${s.date}" onchange="updateTrainerHint()"></div><div><label>Maximale Spieler</label><input id="sMax" type="number" min="1" max="20" value="${s.max}"></div><div><label>Von</label><input id="sFrom" type="time" value="${s.from}"></div><div><label>Bis</label><input id="sTo" type="time" value="${s.to}"></div><div class="full" id="trainerHint"><div class="notice">Deine Zeiten an diesem Tag: ${trainerWindowsForDate(s.date).map(a=>a.from+'–'+a.to).join(', ')||'keine hinterlegt'}</div></div><div class="full"><label>Ort / Platz</label><input id="sPlace" value="${esc(s.place||'')}"></div><div class="full"><label>Schwerpunkt</label><input id="sNote" value="${esc(s.note||'')}" placeholder="z. B. Torabschluss"></div><div class="full"><button class="primary" onclick="saveSlot(${sid||0})">Termin speichern</button></div></div>`)}
function updateTrainerHint(){let e=document.getElementById('trainerHint'),date=document.getElementById('sDate')?.value;if(e)e.innerHTML='<div class="notice">Deine Zeiten an diesem Tag: '+(trainerWindowsForDate(date).map(a=>a.from+'–'+a.to).join(', ')||'keine hinterlegt')+'</div>'}function saveSlot(sid){let date=sDate.value,from=sFrom.value,to=sTo.value,max=+sMax.value;if(!date||!from||!to||max<1)return toast('Bitte alle Pflichtfelder ausfüllen.');if(mins(to)<=mins(from))return toast('Endzeit muss nach der Startzeit liegen.');let probe={id:sid||-1,date,from,to};if(blockedForSlot(probe))return toast('Dieser Termin überschneidet sich mit einem festen Mannschaftstermin.');if(!trainerFits(probe)&&!confirm('Dieser Termin liegt außerhalb deiner hinterlegten Trainerzeiten. Trotzdem speichern?'))return;if(sid){let s=state.slots.find(x=>x.id===sid);Object.assign(s,{date,from,to,max,note:sNote.value.trim(),place:sPlace.value.trim()});s.players=s.players.slice(0,max)}else state.slots.push({id:id(),date,from,to,max,note:sNote.value.trim(),place:sPlace.value.trim(),players:[],wait:[]});closeModal();save();toast('Termin gespeichert.')}
function deleteSlot(sid){if(!confirm('Termin wirklich löschen?'))return;state.slots=state.slots.filter(s=>s.id!==sid);save();toast('Termin gelöscht.')}
function availabilityRow(a={day:'Montag',from:'16:00',to:'18:00'}){return `<div class="dayRow"><div><label>Wochentag</label><select class="aDay">${DAYS.map(d=>`<option ${d===a.day?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Von</label><input class="aFrom" type="time" value="${a.from}"></div><div><label>Bis</label><input class="aTo" type="time" value="${a.to}"></div><button class="danger icon" onclick="this.parentElement.remove()">✕</button></div>`}
function openPlayerForm(pid){let p=pid?player(pid):{name:'',phone:'',active:true,frequency:'weekly',avail:[]};showModal(pid?'Spieler bearbeiten':'Spieler hinzufügen',`<div class="formGrid"><div><label>Name</label><input id="pName" value="${esc(p.name)}"></div><div><label>Telefon optional</label><input id="pPhone" value="${esc(p.phone||'')}"></div><div><label>Preis je Training (€)</label><input id="pPrice" type="number" min="0" step="0.50" value="${Number(p.price)||0}"></div><div class="full"><label>Gewünschte Trainingshäufigkeit</label><select id="pFrequency" onchange="toggleWeekParity()"><option value="every" ${p.frequency==='every'?'selected':''}>Jeden verfügbaren Tag</option><option value="weekly" ${(p.frequency||'weekly')==='weekly'?'selected':''}>1× wöchentlich</option><option value="biweekly" ${p.frequency==='biweekly'?'selected':''}>Alle 2 Wochen</option></select><div class="sub" style="color:var(--muted);margin-top:5px">Die automatische Planung und Nachrückersuche beachten diesen Wunsch.</div></div><div class="full" id="weekParityWrap"><label>Welche Kalenderwochen?</label><select id="pWeekParity"><option value="odd" ${(p.weekParity||'odd')==='odd'?'selected':''}>Ungerade Kalenderwochen (KW 1, 3, 5 ...)</option><option value="even" ${p.weekParity==='even'?'selected':''}>Gerade Kalenderwochen (KW 2, 4, 6 ...)</option></select></div><div class="full"><label><input id="pActive" type="checkbox" style="width:auto" ${p.active?'checked':''}> Spieler aktiv</label></div><div class="full"><div class="row"><h4>Freie Zeitfenster</h4><button class="small" onclick="document.getElementById('availRows').insertAdjacentHTML('beforeend',availabilityRow())">＋ Zeitfenster</button></div><div id="availRows" class="dayRows">${p.avail.map(availabilityRow).join('')}</div></div><div class="full"><button class="primary" onclick="savePlayer(${pid||0})">Spieler speichern</button></div></div>`);toggleWeekParity()}function toggleWeekParity(){let e=document.getElementById('weekParityWrap'),f=document.getElementById('pFrequency');if(e&&f)e.classList.toggle('hidden',f.value!=='biweekly')}
function savePlayer(pid){let name=pName.value.trim();if(!name)return toast('Bitte einen Spielernamen eingeben.');let rows=[...document.querySelectorAll('#availRows .dayRow')];let avail=rows.map(r=>({day:r.querySelector('.aDay').value,from:r.querySelector('.aFrom').value,to:r.querySelector('.aTo').value})).filter(a=>a.from&&a.to&&mins(a.to)>mins(a.from));let frequency=pFrequency.value,weekParity=pWeekParity.value,price=Math.max(0,Number(pPrice.value)||0);if(pid)Object.assign(player(pid),{name,phone:pPhone.value.trim(),price,active:pActive.checked,frequency,weekParity,avail});else state.players.push({id:id(),name,phone:pPhone.value.trim(),price,active:pActive.checked,frequency,weekParity,avail});syncFixedBookingSlots();closeModal();save();toast('Spieler gespeichert. Festtermine wurden an den Trainingsrhythmus angepasst.')}
function deletePlayer(pid){if(!confirm('Spieler und alle Einteilungen wirklich löschen?'))return;state.players=state.players.filter(p=>p.id!==pid);state.slots.forEach(s=>{s.players=s.players.filter(i=>i!==pid);s.wait=s.wait.filter(i=>i!==pid)});save();toast('Spieler gelöscht.')}
function openAssign(sid){let s=state.slots.find(x=>x.id===sid),list=candidates(s);showModal('Spieler einteilen',`<div class="notice">Es werden nur Spieler angezeigt, deren Zeitfenster passt und deren Trainingswunsch eine weitere Einheit zulässt. Wartende Spieler stehen zuerst.</div>${list.map(p=>`<div class="candidate"><div><b>${esc(p.name)}</b><div class="sub" style="color:var(--muted)">${p.avail.filter(a=>fits(a,s)).map(a=>a.day+' '+a.from+'–'+a.to).join(', ')} · ${freqLabel(p.frequency)}${p.frequency==='biweekly'?' ('+parityLabel(p)+')':''}</div></div><button class="primary small" onclick="assign(${sid},${p.id})">Einteilen</button></div>`).join('')||'<div class="empty">Kein passender Spieler gefunden.</div>'}`)}
function assign(sid,pid){let s=state.slots.find(x=>x.id===sid);if(s.players.length>=s.max)return toast('Termin ist bereits voll.');if(!s.players.includes(pid))s.players.push(pid);s.wait=s.wait.filter(i=>i!==pid);closeModal();save();toast(player(pid).name+' wurde eingeteilt.')}
function cancelPlayer(sid,pid){let s=state.slots.find(x=>x.id===sid),p=player(pid),name=p?.name||'Spieler',amount=Number(p?.price)||0;if(!confirm(`${name} als Absage erfassen? ${euro(amount)} werden als Einnahme entfernt und als Verlust gebucht.`))return;state.settings.cancellations.push({id:id(),playerId:pid,slotId:sid,date:s.date,from:s.from,to:s.to,amount,recordedAt:new Date().toISOString()});s.players=s.players.filter(i=>i!==pid);let list=candidates(s,[pid]);save();showModal('Nachrücker finden',`<div class="notice"><b>${esc(name)}</b> wurde als Absage erfasst.<br>Verlust: <b>${euro(amount)}</b>. Folgende Spieler passen zeitlich:</div>${list.map(p=>`<div class="candidate"><div><b>${esc(p.name)}</b><div class="sub" style="color:var(--muted)">${s.wait.includes(p.id)?'Steht bereits auf der Warteliste':'Zeitlich verfügbar'} · ${euro(p.price)}</div></div><button class="primary small" onclick="assign(${sid},${p.id})">Nachrücken</button></div>`).join('')||'<div class="empty">Kein passender Nachrücker verfügbar.</div>'}`)}
function openWait(sid){let s=state.slots.find(x=>x.id===sid),possible=state.players.filter(p=>p.active&&!s.players.includes(p.id));showModal('Warteliste bearbeiten',`${possible.map(p=>`<label class="candidate"><span><b>${esc(p.name)}</b><br><small>${!p.avail.some(a=>fits(a,s))?'passt zeitlich nicht vollständig':frequencyStatus(p,s)}</small></span><input style="width:auto" type="checkbox" ${s.wait.includes(p.id)?'checked':''} onchange="toggleWait(${sid},${p.id},this.checked)"></label>`).join('')||'<div class="empty">Keine weiteren Spieler vorhanden.</div>'}<div class="cardActions"><button class="primary" onclick="closeModal();save()">Fertig</button></div>`)}
function toggleWait(sid,pid,on){let s=state.slots.find(x=>x.id===sid);s.wait=on?[...new Set([...s.wait,pid])]:s.wait.filter(i=>i!==pid);localStorage.setItem(KEY,JSON.stringify(state))}
function addDaysISO(date,n){let d=dateOnly(date);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function intervalOverlap(a,b){return rangesOverlap(a.from,a.to,b.from,b.to)}
function obstaclesForDate(date){let fixed=state.slots.filter(s=>s.date===date&&!s.autoGenerated).map(s=>({from:s.from,to:s.to,type:'slot'}));let blocks=state.settings.trainerBlocks.filter(b=>blockMatchesDate(b,date)).map(b=>({from:b.from,to:b.to,type:'block'}));return [...fixed,...blocks].sort((a,b)=>a.from.localeCompare(b.from))}
function playerAvailableForExactSlot(p,date,from,to){let probe={date,from,to,id:-999,players:[],wait:[]};return p.active&&p.avail.some(a=>fits(a,probe))&&frequencyAllows(p,probe)}
function candidateStartsForSegment(date,from,to,duration){let starts=new Set([from]);for(let p of state.players.filter(x=>x.active)){for(let a of p.avail){if(a.day!==dayFromDate(date))continue;let st=mins(a.from)<mins(from)?from:a.from;if(mins(st)>=mins(from)&&mins(st)+duration<=mins(to))starts.add(st)}}for(let m=mins(from);m+duration<=mins(to);m+=15)starts.add(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));return [...starts].sort()}
function bestSlotInSegment(date,from,to,duration,alreadyPlanned){let options=[];for(let start of candidateStartsForSegment(date,from,to,duration)){let end=addMinutes(start,duration);if(mins(end)>mins(to))continue;let probe={date,from:start,to:end,id:-999,players:[],wait:[]};let possible=state.players.filter(p=>!alreadyPlanned.has(p.id)&&playerAvailableForExactSlot(p,date,start,end));if(!possible.length)continue;possible.sort((a,b)=>priorityScore(b,probe)-priorityScore(a,probe)||(Number(b.price)||0)-(Number(a.price)||0));options.push({from:start,to:end,player:possible[0],score:possible.length*1000+priorityScore(possible[0],probe)+(Number(possible[0].price)||0)})}options.sort((a,b)=>b.score-a.score||a.from.localeCompare(b.from));return options[0]||null}
function createOptimizedSlots(days=28){let today=new Date();today.setHours(12,0,0,0);let todayISO=today.toISOString().slice(0,10);state.slots=state.slots.filter(s=>!s.autoGenerated||s.date<todayISO);let created=0;for(let i=0;i<days;i++){let date=addDaysISO(todayISO,i),windows=trainerWindowsForDate(date);if(!windows.length)continue;let alreadyPlanned=new Set(state.slots.filter(s=>s.date===date).flatMap(s=>s.players));for(let w of windows){let obs=obstaclesForDate(date).filter(o=>rangesOverlap(w.from,w.to,o.from,o.to));let segments=[],cursor=w.from;for(let o of obs){if(mins(o.from)>mins(cursor))segments.push({from:cursor,to:o.from});if(mins(o.to)>mins(cursor))cursor=o.to}if(mins(cursor)<mins(w.to))segments.push({from:cursor,to:w.to});for(let seg of segments){let cursor2=seg.from;while(mins(cursor2)+(state.settings.slotDuration||60)<=mins(seg.to)){let best=bestSlotInSegment(date,cursor2,seg.to,state.settings.slotDuration||60,alreadyPlanned);if(!best)break;state.slots.push({id:id(),autoGenerated:true,date,from:best.from,to:best.to,max:1,note:'Automatisch optimiert',place:'',players:[best.player.id],wait:[]});alreadyPlanned.add(best.player.id);created++;cursor2=best.to}}}}return created}
function optimizeSchedule(){syncFixedBookingSlots();let created=createOptimizedSlots(28);save();toast(created?created+' optimale Trainingsplätze für die nächsten 4 Wochen erstellt und belegt.':'Keine zusätzlichen passenden Trainingsplätze gefunden.')}
function autoPlan(){let count=0,skipped=0;for(let s of [...state.slots].sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from))){if(!trainerFits(s)||blockedForSlot(s)){skipped++;continue}while(s.players.length<s.max){let p=candidates(s)[0];if(!p)break;s.players.push(p.id);s.wait=s.wait.filter(i=>i!==p.id);count++}}save();toast(count?count+' Plätze belegt. '+(skipped?skipped+' Termine außerhalb deiner Zeiten wurden übersprungen.':''):(skipped?'Keine Einteilung. '+skipped+' Termine liegen außerhalb deiner Trainerzeiten.':'Keine passende automatische Einteilung gefunden.'))}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('Text kopiert.')).catch(()=>{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Text kopiert.')})}function copySlot(sid){let s=state.slots.find(x=>x.id===sid);copyText(`⚽ *Einzeltraining*\n📅 ${fmtDate(s.date)}\n⏰ ${s.from}–${s.to} Uhr\n📍 ${s.place||'Ort folgt'}\n🎯 ${s.note||'Einzeltraining'}\n👤 ${s.players.map(i=>player(i)?.name).filter(Boolean).join(', ')||'Noch frei'}`)}async function shareText(){let text=buildMessage();if(navigator.share)try{await navigator.share({title:'Einzeltraining',text})}catch(e){}else copyText(text)}
function saveSettings(){state.settings.club=club.value.trim();state.settings.trainer=trainer.value.trim();state.settings.defaultMax=Math.max(1,+defMax.value||2);state.settings.slotDuration=Math.max(15,+slotDuration.value||60);save();toast('Einstellungen gespeichert.')}
function exportData(){let stamp=new Date().toISOString().replace(/[:.]/g,'-'),club=(state.settings.club||'Verein').replace(/[^a-z0-9äöüß-]+/gi,'_');let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${club}_Einzeltraining_${stamp}.json`;a.click();URL.revokeObjectURL(a.href);toast('Sicherung erstellt.')}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.players)||!Array.isArray(x.slots))throw Error();state=x;save();toast('Sicherung importiert.')}catch(e){toast('Datei ist keine gültige Sicherung.')}};r.readAsText(file)}function resetData(){if(!confirm('Wirklich alle Daten löschen und Demo-Daten wiederherstellen?'))return;state=clone(seed);save();toast('Demo-Daten wiederhergestellt.')}
function localISODate(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function timeOptions(selected){let html='';for(let m=0;m<1440;m+=5){let v=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');html+=`<option value="${v}" ${v===selected?'selected':''}>${v} Uhr</option>`}return html}function enforce24HourControls(root=document){root.querySelectorAll('input[type="time"]').forEach(input=>{let sel=document.createElement('select');for(let a of input.attributes){if(a.name!=='type'&&a.name!=='value')sel.setAttribute(a.name,a.value)}sel.className=input.className;sel.innerHTML=timeOptions(input.value||'00:00');input.replaceWith(sel)})}const timeObserver=new MutationObserver(entries=>{for(let e of entries)for(let n of e.addedNodes)if(n.nodeType===1)enforce24HourControls(n)});timeObserver.observe(document.body,{childList:true,subtree:true});function focusCurrentOrNextDay(smooth=false){if(activeTab!=='planung')return;let cards=[...document.querySelectorAll('[data-slot-date]')];if(!cards.length)return;let today=localISODate(),target=cards.find(c=>c.dataset.slotDate===today)||cards.find(c=>c.dataset.slotDate>today)||cards[0];setTimeout(()=>target.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'}),100)}
document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(!b)return;activeTab=b.dataset.tab;document.querySelectorAll('.tabPage').forEach(x=>x.classList.toggle('hidden',x.id!==activeTab));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));if(activeTab==='planung')focusCurrentOrNextDay(true)});
syncFixedBookingSlots();render();enforce24HourControls();focusCurrentOrNextDay(false);
</script>
